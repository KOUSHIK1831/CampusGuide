name: RAG unit tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install 'torch>=2,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
