# Optional Render hosting for the Streamlit BYOK upload-and-chat app.
# Streamlit Community Cloud is the primary deployment target.
# Do not configure a shared GROQ_API_KEY for this public app.
services:
  - type: web
    name: campusguide-rag-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: VECTOR_BACKEND
        value: faiss
      - key: MIN_RETRIEVAL_SCORE
        value: '0.30'
