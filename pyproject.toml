[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "campusguide"
version = "0.2.0"
description = "Local, source-cited university document RAG chatbot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "streamlit>=1.39,<2",
  "python-dotenv>=1.0,<2",
  "groq>=0.9,<2",
  "numpy>=1.26,<3",
  "faiss-cpu>=1.8,<2",
  "sentence-transformers>=3.0,<6",
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["campusguide_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
